<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Colordoku preview image</title>
    <link rel="stylesheet" href="../site/css/tokens.css" />
    <link rel="stylesheet" href="../site/css/layout.css" />
    <link rel="stylesheet" href="../site/css/board.css" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        padding: 0 84px;
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 72px;
        align-items: center;
        background: var(--panel);
      }

      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: inset 0 0 0 16px var(--bg);
      }

      h1 {
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 36px 0 0;
      }

      p {
        font-size: 34px;
        line-height: 1.3;
        color: var(--muted);
        margin: 24px 0 0;
      }

      .board-wrap {
        width: 470px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="logo"></div>
      <h1>Colordoku</h1>
      <p>One mark per row, column, and color. Marks can’t touch.</p>
    </div>
    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Sample board"></div>
    </div>
    <script type="module">
      import { generatePuzzle } from '../site/js/game/generator.js';
      import { cellKey, marksConflict } from '../site/js/game/rules.js';
      import { Board } from '../site/js/ui/board.js';

      const puzzle = generatePuzzle(8, 'colordoku');
      const noop = () => {};
      const board = new Board(document.querySelector('#board'), {
        onPressStart: noop,
        onPressMove: noop,
        onPressEnd: noop,
        onMarkRequest: noop,
        onCrossRequest: noop,
      });
      board.setPuzzle(puzzle);
      const marks = puzzle.solution.slice(0, 4).map((column, row) => [row, column]);
      const marked = new Set(marks.map(([row, column]) => cellKey(row, column)));
      const crossed = new Set();
      for (let row = 0; row < puzzle.size; row++) {
        for (let column = 0; column < puzzle.size; column++) {
          const key = cellKey(row, column);
          if (marked.has(key)) continue;
          if (marks.some((mark) => marksConflict(puzzle.regions, mark, [row, column]))) {
            crossed.add(key);
          }
        }
      }
      board.update({ crossed, marked }, { conflicts: new Set(), hintTargets: new Set() });
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
